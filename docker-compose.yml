version: '3.8'

services:
  frontend:
    build:
      context: .  # Use the current directory as the build context
      dockerfile: Dockerfile  # Specify the Dockerfile for the frontend
    ports:
      - "4200:80"  # Map port 4200 on the host to port 80 in the container (Nginx serves on port 80)
    volumes:
      - .:/frontend  # Optional: mount the current directory for live updates
      - /frontend/node_modules  # Avoid mounting node_modules
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge